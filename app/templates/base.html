<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Forum{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0d0f;
      --surface: #141416;
      --card: #1a1a1e;
      --border: #2a2a30;
      --accent: #e8ff47;
      --accent2: #ff6b35;
      --text: #f0f0f0;
      --muted: #666680;
      --danger: #ff4757;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    nav {
      position: sticky; top: 0;
      background: rgba(13,13,15,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 56px;
      z-index: 100;
    }
    .nav-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--accent);
      text-decoration: none;
    }
    .nav-logo span { color: var(--text); }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .nav-user {
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--card);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .nav-user strong { color: var(--accent); }
    .btn-link {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .btn-link:hover { border-color: var(--border); color: var(--text); }
    .container { max-width: 860px; margin: 0 auto; padding: 2.5rem 1.5rem; }
    .flash {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 0.8rem;
      border-left: 3px solid var(--danger);
      background: rgba(255,71,87,0.08);
      color: var(--danger);
    }
    .btn {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 0.8rem;
      padding: 8px 18px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary { background: var(--accent); color: #0d0d0f; }
    .btn-primary:hover { background: #d4e840; transform: translateY(-1px); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% if session.username %}
  <nav>
    <a class="nav-logo" href="/forums">FORUM<span>·APP</span></a>
    <div class="nav-right">
      <span class="nav-user">connecté : <strong>{{ session.username }}</strong></span>
      <a class="btn-link" href="/logout">déconnexion</a>
    </div>
  </nav>
  {% endif %}
  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
