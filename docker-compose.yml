services:
  web:
    build: .
    ports:
      - "1234:5000"
    volumes:
      - ./app:/app
    depends_on:
      - instaDbRedis
    environment:
      - REDIS_HOST=instadbRedis
      - REDIS_PORT=6379
      - REDIS_DB=06        

  instaDbRedis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data: